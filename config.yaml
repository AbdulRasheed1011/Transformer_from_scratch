project:
  name : transformer_from_scratch

paths:
  data_dir : data/
  raw_dir : data/raw/
  processed_dir : data/processed/
  checkpoints_dir : artifacts/checkpoints/
  
dataset:
  name : cnn_dailymail
  version : 3.0.0
  split_train : train
  split_val : validation
  split_test : test
  max_input_len : 512
  max_target_len : 128

tokenizer:
  model_name : 't5-small'
  vocab_size : 32000
  lower_case : true
  pad_token : '<pad>'
  

training:
  batch_size : 32
  num_epochs : 3
  learning_rate : 3e-4
  warmup_steps : 4000

model:
  d_model : 512
  num_heads : 8
  d_ff : 2048
  
  num_encoder_layers : 6
  num_decoder_layers : 6

  dropout : 0.1

  vocab_size : 32000
  max_position_embedding : 512

  pad_token_id : 0
  bos_toekn_id : 0
  eos_token_id : 1






